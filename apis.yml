aid: datakrew
name: Datakrew
description: >-
  Datakrew is a Singapore-based deep-tech company, a spin-off from NTU Singapore
  supported by Enterprise Singapore, building EV battery intelligence, fleet
  management, and AI-driven telematics for logistics and delivery, public
  transport, vehicle OEMs, rental/leasing and shared mobility operators, and
  mining and construction fleets. Its integrated hardware, software, and AI
  stack spans the OxRed (MyFleet) fleet-management and intelligence platform,
  OxRed Lens camera-based visualization telematics, OxRed AutoCert automated
  certification and compliance, GuardianAI driver-safety and collision-warning
  analytics, the Ask OX natural-language fleet assistant, and the ITUS Max and
  ITUS AutoScan edge terminals for telemetry, CAN-bus integration, and vehicle
  diagnostics, all aimed at optimizing battery health, safety, and operational
  efficiency.
